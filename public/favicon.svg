<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
	<!-- A Noh mask: flat ivory silhouette and two eye holes. Drawn on a 16-unit grid so that at 16px the
	     eyes land on whole pixels (3x1 each, row 7) instead of blurring into grey. -->
	<rect width="16" height="16" rx="3.5" fill="#0B0D10" />
	<path d="M8 1c3.4 0 5.5 2.6 5.5 6.1 0 4.3-2.4 7.9-5.5 7.9S2.5 11.4 2.5 7.1C2.5 3.6 4.6 1 8 1Z" fill="#EFE6D6" />
	<path d="M4 7.5 5 7h1.6L7 7.5 6.6 8H5Z M12 7.5 11 7H9.4L9 7.5 9.4 8H11Z" fill="#0B0D10" />
</svg>
