# Netlify builds the static site on every push to main, and once a day from
# .github/workflows/scheduled-build.yml so new Zenn articles show up.
# Redirects and the Japanese 404 page are in public/_redirects.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 needs Node 22.23.4 or later; .nvmrc pins the same version.
  NODE_VERSION = "22.23.4"

# Build assets have content hashes in their names, so browsers can keep them for good.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# PostHog through this site's own domain (uutaa.cc/noh/...), so ad blockers that block
# posthog.com don't drop page views. Proxying needs the custom domain: netlify.app alters
# Content-Encoding. The two asset rules must come before the catch-all; `host` makes
# PostHog route the request, and `force` proxies even if a file exists at the path.
[[redirects]]
  from = "/noh/static/*"
  to = "https://us-assets.i.posthog.com/static/:splat"
  host = "us-assets.i.posthog.com"
  status = 200
  force = true

[[redirects]]
  from = "/noh/array/*"
  to = "https://us-assets.i.posthog.com/array/:splat"
  host = "us-assets.i.posthog.com"
  status = 200
  force = true

[[redirects]]
  from = "/noh/*"
  to = "https://us.i.posthog.com/:splat"
  host = "us.i.posthog.com"
  status = 200
  force = true
